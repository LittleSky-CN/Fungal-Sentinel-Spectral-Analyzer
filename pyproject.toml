[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fssa"
version = "1.6.0"
description = "FSSA (Fungal Sentinel Spectral Analyzer) - offline-first desktop pipeline for smartphone-DNG grating fluorescence spectroscopy"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["spectroscopy", "fluorescence", "unmixing", "dng", "loD", "igem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tifffile>=2023.7.10",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pypdf>=3.0"]

[project.urls]
Homepage = "https://github.com/LittleSky-CN/Fungal-Sentinel-Spectral-Analyzer"
Repository = "https://github.com/LittleSky-CN/Fungal-Sentinel-Spectral-Analyzer"
Android-counterpart = "https://github.com/LittleSky-CN/Mycospec"

[tool.setuptools]
# Explicit inventory: root-level modules plus the two code packages.
# Ships code plus runtime assets only; no __pycache__ in the wheel.
py-modules = ["main", "config"]
packages = ["core", "gui"]

[tool.setuptools.dynamic]
